[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-isomorphisms"
description = "Normalise poker flops and enumerate suit-isomorphic representations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Euan McNicholas" },
]
keywords = ["poker", "flop", "isomorphism", "cards"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Thurpan/poker_isomorphisms"
Repository = "https://github.com/Thurpan/poker_isomorphisms"
Issues = "https://github.com/Thurpan/poker_isomorphisms/issues"
Changelog = "https://github.com/Thurpan/poker_isomorphisms/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["poker_isomorphisms*"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "poker_isomorphisms.__version__" }

[tool.setuptools.package-data]
poker_isomorphisms = ["py.typed"]
