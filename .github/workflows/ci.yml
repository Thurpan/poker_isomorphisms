name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release-validation:
    name: Validate distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib.metadata as metadata
          from pathlib import Path

          import poker_isomorphisms as package

          assert metadata.version("poker-isomorphisms") == "1.0.0"
          assert package.flop_normalise("7cQc3s") == "Qs7s3h"
          assert (Path(package.__file__).parent / "py.typed").is_file()
          PY

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
